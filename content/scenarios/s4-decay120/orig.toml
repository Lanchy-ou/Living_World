# Living Island — v0.1 configuration.
# **Approved v0.1 (2026-11-08).** Rules and semantics are frozen. Numeric values in
# `content/worlds/default.toml` are candidates to be tuned in P2 without changing this spec.
# `Perception`, `ActionPlan`, `ActionIntent`, `ActionResult` and `DecisionTrigger` are frozen
# unless the agent-interface spec requires a change, which must go through a spec amendment task.
# `DecisionContext` remains provisional.
# Repo destination: content/worlds/default.toml
# Rule semantics: docs/spec/world-rules-v0.1.md; all values subject to testing.
# No floating-point configuration in the authoritative simulation.

[meta]
schema_version = "0.1"
world_id = "default_island"
run_id = "s4_decay120" # deterministic ID for replay tests
seed = 20261108

[map]
width = 64
height = 64
layout_file = "../../worlds/default-island.map"
tile_size_m = 50
tile_meaning = "one approximately 50 m x 50 m terrain patch; not one 10-minute walk"
# One tick can traverse several orthogonal tiles; terrain consumes integer cost units.
walk_cost_budget_per_tick = 8 # 8 x 50 m per 10 min = 2.4 km/h on open ground; 1.2 km/h in woods
step_cost_beach = 1
step_cost_grass = 1
step_cost_woods = 2
step_cost_cave = 1
step_cost_damp_moss = 1
step_cost_fruit_tree = 2 # F is a wooded patch, even if adjacent tiles are grass

[time]
tick_minutes = 10
start_hour = 6
day_start_hour = 6
day_end_hour = 20

[needs]
min_value = 0
max_value = 10000
initial_satiety = 7500
initial_hydration = 8000
initial_stamina = 8500
initial_health = 10000
satiety_decay_per_tick = 25
hydration_decay_per_tick = 120
stamina_awake_decay_per_tick = 40
stamina_move_extra_cost_per_tick = 60
stamina_gather_cost_per_completion = 300
satiety_gain_per_fruit = 2000
hydration_gain_per_serving = 6000
health_loss_per_tick_if_deprived = 70
health_recovery_sleep_per_tick = 15
health_recovery_min_satiety = 2500
health_recovery_min_hydration = 2500
stamina_rest_gain_per_tick = 120
stamina_sleep_gain_per_tick = 180
stamina_sleep_cave_bonus_per_tick = 40

[fruit]
initial_stock_per_tree = 1
max_stock_per_tree = 5
regrow_ticks = 144
regrow_per_cycle = 1

[inventory]
slot_capacity = 10 # fruit counts as one per unit; unique canteen counts as one

[canteen]
unique_item_id = "canteen_01"
capacity_servings = 2
initial_servings = 2
initial_owner_id = "ryan"

[actions]
invalid_attempt_ticks = 1
gather_ticks = 2
eat_ticks = 1
drink_ticks = 1
fill_canteen_ticks = 1
rest_ticks = 6
sleep_ticks = 48
talk_ticks = 1
give_ticks = 1
pick_up_ticks = 1
wait_ticks = 1

[perception]
day_radius_tiles = 8 # ~400 m
night_radius_tiles = 3 # ~150 m
hearing_radius_tiles = 1 # same or adjacent tile, <= ~50 m
cue_detail_radius_tiles = 1
fruit_few_max = 2
need_band_cutoffs = [2000, 4000, 6000, 8000]
visible_weakness_health_below = 3500
visible_dehydration_hydration_below = 2500
visible_fatigue_stamina_below = 2500

[social]
max_dialogue_turns = 6 # one turn = one utterance, not a paired exchange
dialogue_gap_ticks = 2 # gap > this ends an open pairwise session
dialogue_cooldown_ticks = 12 # cooldown after dialogue cap is reached

[agents]
max_plan_actions = 5
urgent_satiety_below = 3000
urgent_hydration_below = 3000
urgent_stamina_below = 2500
max_high_level_decisions_per_resident_per_day_soft = 20
llm_retry_on_parse_error = 1
# Wall-clock provider timeout belongs to the LLM adapter, not authoritative simulation.

