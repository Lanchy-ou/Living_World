pack_id = "starter-v1"
pack_version = "0.1"
extends = "compat-v1"
vocabulary_version = "vocab/0.1"
vocabulary_hash = "57554435492d6f3db83006a4510b292f8b0d1ebc70c3393663fd1a9ad94cf286"
enabled_needs = ["mental_fatigue"]
enabled_verbs = ["combine", "strike", "cut", "light", "build"]
sight_while_asleep = { replace = true, value = false }

[needs.satiety]
replace = true
min = "${min_value}"
max = "${max_value}"
initial = "${initial_satiety}"
band_cutoffs = "${need_band_cutoffs}"
max_gain_per_tick = "${satiety_gain_bound}"
max_loss_per_tick = "${satiety_loss_bound}"
thresholds = [
  { id = "urgent", at = "${urgent_satiety_below}", wakes = false },
  { id = "critical", at = 1999, wakes = true },
]

[needs.hydration]
replace = true
min = "${min_value}"
max = "${max_value}"
initial = "${initial_hydration}"
band_cutoffs = "${need_band_cutoffs}"
max_gain_per_tick = "${hydration_gain_bound}"
max_loss_per_tick = "${hydration_loss_bound}"
thresholds = [
  { id = "urgent", at = "${urgent_hydration_below}", wakes = false },
  { id = "critical", at = 1999, wakes = true },
]

[needs.stamina]
replace = true
min = "${min_value}"
max = "${max_value}"
initial = "${initial_stamina}"
band_cutoffs = "${need_band_cutoffs}"
max_gain_per_tick = "${stamina_gain_bound}"
max_loss_per_tick = "${stamina_loss_bound}"
thresholds = [
  { id = "urgent", at = "${urgent_stamina_below}", wakes = false },
]

[needs.mental_fatigue]
min = 0
max = 10000
initial = 0
band_cutoffs = [2000, 4000, 6000, 8000]
max_gain_per_tick = 0
max_loss_per_tick = 0
thresholds = [{ id = "critical", at = 1999, wakes = false }]

[physiology]
replace = true
satiety_awake_decay_per_tick = "${satiety_decay_per_tick}"
satiety_asleep_decay_per_tick = 15
hydration_awake_decay_per_tick = "${hydration_decay_per_tick}"
hydration_asleep_decay_per_tick = 60
stamina_awake_decay_per_tick = "${stamina_awake_decay_per_tick}"
stamina_move_extra_cost_per_tick = "${stamina_move_extra_cost_per_tick}"
health_loss_per_tick_if_deprived = "${health_loss_per_tick_if_deprived}"
health_recovery_sleep_per_tick = "${health_recovery_sleep_per_tick}"
health_recovery_min_satiety = "${health_recovery_min_satiety}"
health_recovery_min_hydration = "${health_recovery_min_hydration}"
awake_per_tick = 30
per_utterance_heard = 20
per_first_sighting = 30
recovery_per_tick_asleep = 150
faint_ticks = 36

[timing]
replace = true
invalid_attempt_ticks = "${invalid_attempt_ticks}"
give_ticks = "${give_ticks}"
pick_up_ticks = "${pick_up_ticks}"
wait_ticks = "${wait_ticks}"
talk_ticks = "${talk_ticks}"
sleep_ticks = "${sleep_ticks}"
drop_ticks = 1
inspect_ticks = 1

[timing.attempt_ticks]
gather = 1
eat = 1
drink = 1
fill = 1
rest = 1
sleep = 1
combine = 1
strike = 1
cut = 1
light = 1
build = 1

[sources.deadwood_regrowth]
archetype = "branch"
max_per_application = 1

[sources.grass_regrowth]
archetype = "grass_tuft"
max_per_application = 1
