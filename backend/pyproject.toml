[project]
name = "living-island"
version = "0.1.0"
description = "Living Island: self-running island simulation with LLM-driven residents"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_island"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["living_island"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "living_island"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "world is pure: no other subpackage, no LLM/network libraries"
type = "forbidden"
source_modules = ["living_island.world"]
forbidden_modules = [
    "living_island.agents",
    "living_island.memory",
    "living_island.events",
    "living_island.sim",
    "living_island.persistence",
    "living_island.contract",
    "anthropic",
    "openai",
    "httpx",
    "requests",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "agents see world only via world.protocol"
type = "forbidden"
source_modules = ["living_island.agents"]
forbidden_modules = ["living_island.world"]
# Both direct and memory-mediated paths end at the same permitted pure protocol.
# Other world paths remain forbidden, including indirect memory paths.
ignore_imports = [
    "living_island.agents.** -> living_island.world.protocol",
    "living_island.memory.** -> living_island.world.protocol",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "memory sees world only via world.protocol"
type = "forbidden"
source_modules = ["living_island.memory"]
forbidden_modules = ["living_island.world"]
ignore_imports = ["living_island.memory.** -> living_island.world.protocol"]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "events is read-only: no sim, no persistence"
type = "forbidden"
source_modules = ["living_island.events"]
forbidden_modules = ["living_island.sim", "living_island.persistence"]

[[tool.importlinter.contracts]]
name = "world.protocol is standalone: no other world module"
type = "forbidden"
source_modules = ["living_island.world.protocol"]
forbidden_modules = [
    "living_island.world.state",
    "living_island.world.facts",
    "living_island.world.content",
    "living_island.world.ports",
]

[[tool.importlinter.contracts]]
name = "agents never import contract, persistence or sim"
type = "forbidden"
source_modules = ["living_island.agents"]
forbidden_modules = [
    "living_island.contract",
    "living_island.persistence",
    "living_island.sim",
]

[[tool.importlinter.contracts]]
name = "analysis is read-only: no world internals, sim, persistence or policies"
type = "forbidden"
source_modules = ["living_island.analysis"]
forbidden_modules = [
    "living_island.world",
    "living_island.sim",
    "living_island.persistence",
    "living_island.memory",
    "living_island.agents.runtime",
    "living_island.agents.policies",
    "living_island.agents.rule_based",
    "living_island.agents.p3",
    "living_island.agents.llm",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "memory is pure: no agents, coordination, storage, contract or network"
type = "forbidden"
source_modules = ["living_island.memory"]
forbidden_modules = [
    "living_island.agents",
    "living_island.sim",
    "living_island.persistence",
    "living_island.contract",
    "anthropic",
    "openai",
    "httpx",
    "requests",
]
