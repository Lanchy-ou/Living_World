[project]
name = "living-island"
version = "0.1.0"
description = "Living Island: self-running island simulation with LLM-driven residents"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_island"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["living_island"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "living_island"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "resident-audit-isolation"
name = "Resident memory, decisions and consolidation cannot read the audit"
type = "forbidden"
source_modules = [
    "living_island.agents",
    "living_island.memory",
    "living_island.sim.v2.harness.consolidation",
]
forbidden_modules = ["living_island.persistence.v2.audit"]

[[tool.importlinter.contracts]]
name = "world is pure: no other subpackage, no LLM/network libraries"
type = "forbidden"
source_modules = ["living_island.world"]
forbidden_modules = [
    "living_island.agents",
    "living_island.memory",
    "living_island.events",
    "living_island.sim",
    "living_island.persistence",
    "living_island.contract",
    "anthropic",
    "openai",
    "httpx",
    "requests",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "agents see world only via world.protocol"
type = "forbidden"
source_modules = ["living_island.agents", "living_island.agents.**"]
forbidden_modules = ["living_island.world", "living_island.world.*"]
as_packages = false
ignore_imports = [
    "living_island.agents.** -> living_island.world.protocol",
    "living_island.memory.** -> living_island.world.protocol",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "memory sees world only via world.protocol"
type = "forbidden"
source_modules = ["living_island.memory", "living_island.memory.**"]
forbidden_modules = ["living_island.world", "living_island.world.*"]
as_packages = false
ignore_imports = ["living_island.memory.** -> living_island.world.protocol"]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "agents and memory see world only via the v1 and v2 protocols"
type = "forbidden"
source_modules = ["living_island.agents", "living_island.memory"]
forbidden_modules = ["living_island.world"]
ignore_imports = [
    "living_island.agents.** -> living_island.world.protocol",
    "living_island.memory.** -> living_island.world.protocol",
    "living_island.agents.** -> living_island.world.v2.protocol",
    "living_island.memory.** -> living_island.world.v2.protocol",
]
# The v1 contracts above keep their exceptions strict. V2 may have no consumers yet.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "agents and memory initializers do not import world directly"
type = "forbidden"
source_modules = ["living_island.agents", "living_island.memory"]
forbidden_modules = ["living_island.world", "living_island.world.**"]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "world.v2 imports no other living_island subpackage"
type = "forbidden"
source_modules = ["living_island.world.v2"]
forbidden_modules = ["living_island.*"]

[[tool.importlinter.contracts]]
name = "world.v2 does not import v1 world modules"
type = "forbidden"
# Match the v1 package initializer as a module without including its v2 subtree.
as_packages = false
source_modules = ["living_island.world.v2", "living_island.world.v2.**"]
forbidden_modules = [
    "living_island.world",
    "living_island.world.actions",
    "living_island.world.canteen",
    "living_island.world.content",
    "living_island.world.death",
    "living_island.world.dialogue",
    "living_island.world.engine",
    "living_island.world.facts",
    "living_island.world.interrupts",
    "living_island.world.movement",
    "living_island.world.observation",
    "living_island.world.pathfinding",
    "living_island.world.perception",
    "living_island.world.physiology",
    "living_island.world.ports",
    "living_island.world.protocol",
    "living_island.world.receipts",
    "living_island.world.resources",
    "living_island.world.results",
    "living_island.world.rng",
    "living_island.world.rulefacts",
    "living_island.world.space",
    "living_island.world.state",
]

[[tool.importlinter.contracts]]
name = "world.v2.protocol is standalone: no other living_island modules"
type = "forbidden"
source_modules = ["living_island.world.v2.protocol"]
forbidden_modules = ["living_island", "living_island.**"]
as_packages = false
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "events is read-only: no sim, no persistence"
type = "forbidden"
source_modules = ["living_island.events"]
forbidden_modules = ["living_island.sim", "living_island.persistence"]

[[tool.importlinter.contracts]]
name = "world.protocol is standalone: no other world module"
type = "forbidden"
source_modules = ["living_island.world.protocol"]
forbidden_modules = [
    "living_island.world.state",
    "living_island.world.facts",
    "living_island.world.content",
    "living_island.world.ports",
]

[[tool.importlinter.contracts]]
name = "agents never import contract, persistence or sim"
type = "forbidden"
source_modules = ["living_island.agents"]
forbidden_modules = [
    "living_island.contract",
    "living_island.persistence",
    "living_island.sim",
]

[[tool.importlinter.contracts]]
name = "analysis is read-only: no world internals, sim, persistence or policies"
type = "forbidden"
source_modules = ["living_island.analysis"]
forbidden_modules = [
    "living_island.world",
    "living_island.sim",
    "living_island.persistence",
    "living_island.memory",
    "living_island.agents.runtime",
    "living_island.agents.policies",
    "living_island.agents.rule_based",
    "living_island.agents.p3",
    "living_island.agents.llm",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "memory is pure: no agents, coordination, storage, contract or network"
type = "forbidden"
source_modules = ["living_island.memory"]
forbidden_modules = [
    "living_island.agents",
    "living_island.sim",
    "living_island.persistence",
    "living_island.contract",
    "anthropic",
    "openai",
    "httpx",
    "requests",
]
