max_value = 10000
initial_satiety = 7500
initial_hydration = 400
initial_stamina = 8500
initial_health = 70
satiety_decay_per_tick = 25
hydration_decay_per_tick = 100 # candidate control: 60 ticks per serving; sleep costs 4800
stamina_awake_decay_per_tick = 40
stamina_move_extra_cost_per_tick = 60
stamina_gather_cost_per_completion = 300
satiety_gain_per_fruit = 2000
