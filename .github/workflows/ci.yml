name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # P3 registrations read frozen content from pinned historical commits
          # (e.g. scripts/p3_trials.py WORLD_COMMIT); a shallow clone lacks them.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory backend --locked
      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend ruff format --check .
      - run: uv run --directory backend mypy src
      - run: uv run --directory backend lint-imports --no-cache
      - run: uv run --directory backend pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend run test:schema
      - run: pnpm --dir frontend run test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --directory backend --locked
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: uv run --directory backend python ../scripts/gen_types.py
      - run: uv run --directory backend python ../scripts/gen_p3_inspection_types.py
      - run: uv run --directory backend python ../scripts/gen_v2_inspection_types.py
      - run: git diff --exit-code
